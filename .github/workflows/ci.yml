name: CI

on:
  push:
    # Docs-only changes start no CI run (docs get push, merge and publish only).
    paths-ignore:
      - '**.md'
      - '**.mdx'
      - '**.rst'
      - '**.docx'
      - '**.pdf'
      - '**/LICENSE'
      - '**/LICENSE.*'
      - '**/NOTICE'
      - '**/NOTICE.*'
      - 'docs/**.png'
      - 'docs/**.jpg'
      - 'docs/**.svg'
      - 'docs/**.gif'
      - 'docs/**.webp'
      - 'docs/**.html'
      - 'docs/**.css'
  pull_request:
    # Docs-only changes start no CI run (docs get push, merge and publish only).
    paths-ignore:
      - '**.md'
      - '**.mdx'
      - '**.rst'
      - '**.docx'
      - '**.pdf'
      - '**/LICENSE'
      - '**/LICENSE.*'
      - '**/NOTICE'
      - '**/NOTICE.*'
      - 'docs/**.png'
      - 'docs/**.jpg'
      - 'docs/**.svg'
      - 'docs/**.gif'
      - 'docs/**.webp'
      - 'docs/**.html'
      - 'docs/**.css'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
