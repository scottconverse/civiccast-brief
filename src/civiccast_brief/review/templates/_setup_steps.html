{# The wizard's step list. Expects setup_steps: [{key, label, number, current}]. #}
{% if setup_steps %}
<nav class="setup-tabs" aria-label="Setup steps">
  <ol>
  {% for step in setup_steps %}
    <li{% if step.current %} class="current"{% endif %}>
    {% if step.current %}
      <span aria-current="step">{{ step.number }} {{ step.label }}</span>
    {% else %}
      <a href="/setup/{{ step.key }}">{{ step.number }} {{ step.label }}</a>
    {% endif %}
    </li>
  {% endfor %}
  </ol>
</nav>
{% endif %}
