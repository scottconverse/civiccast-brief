<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} | CivicCast Brief producer screen</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.45;
           max-width: 60rem; margin: 0 auto; padding: 1rem; }
    header a { color: inherit; text-decoration: none; }
    h1 { font-size: 1.4rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .4rem .5rem; border-bottom: 1px solid #8885;
             vertical-align: top; }
    textarea { width: 100%; box-sizing: border-box; font: inherit; min-height: 12rem; }
    input[type=text] { font: inherit; min-width: 16rem; }
    fieldset { border: 1px solid #8886; margin: 1rem 0; }
    .notice { border-left: 4px solid #2a7; padding: .5rem .75rem; background: #2a72;
              margin: 1rem 0; }
    .notice.error { border-color: #c33; background: #c332; }
    .status { font-weight: 600; text-transform: uppercase; font-size: .8em;
              letter-spacing: .04em; }
    .actions { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; margin: 1rem 0; }
    .actions form { margin: 0; }
    button { font: inherit; padding: .4rem .9rem; cursor: pointer; }
    .muted { color: #777; }
  </style>
</head>
<body>
<header><h1><a href="/">CivicCast Brief producer screen</a></h1></header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
