[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "civiccast-brief"
version = "0.1.0"
description = "A lite, self-hosted tool: city meeting video in, cited recap, podcast episode and static city site out."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "quorumrelay==0.1.0.dev7",
    "fastapi>=0.115",
    # httpx, pypdf and tzdata are for the record package, copied from TownRecord.
    "httpx>=0.28.1",
    "jinja2>=3.1",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.9",
    "tzdata>=2025.1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Telling speakers apart (meeting --diarize), with the diarizer copied from textflowkit.
# 4.x is required: 3.4.x imports torchaudio.AudioMetaData, which torchaudio 2.11 no longer
# provides. soundfile reads the audio; pyannote 4 no longer pulls it in. This pulls the
# PyTorch stack, so it is optional: captions and stories do not need it.
diarize = ["pyannote.audio>=4.0", "soundfile>=0.13"]
# Reading record sites that open only in a browser (Laserfiche WebLink), in the installed
# Google Chrome. Playwright drives that Chrome; it does not download a browser of its own.
browser = ["playwright>=1.50"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
quorumrelay = { path = "vendor/quorumrelay-0.1.0.dev7-py3-none-any.whl" }

[tool.hatch.build.targets.wheel]
packages = ["src/civiccast_brief"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: really installs a tool through PyPI; needs uv and the network",
]
